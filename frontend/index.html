  <noscript>
    <h1>MeowCloud｜個人雲端儲存</h1>
    <p>把檔案放上自己的雲端：上傳、瀏覽、協作、共編，在瀏覽器裡完成，手機電腦免安裝。</p>
    <h2>檔案協作與即時共編</h2>
    <p>邀請夥伴一起編輯文件，編輯者／檢視者權限涇渭分明，變更即時同步。</p>
    <h2>加密分享連結</h2>
    <p>一條連結一套權限：可設密碼、到期日，並能隨時撤銷。</p>
    <h2>隱私自主</h2>
    <p>你的資料存在自己管理的伺服器上，不依賴第三方平台。</p>
    <h2>常見問題</h2>
    <h3>需要安裝 App 嗎？</h3>
    <p>不用，開瀏覽器即用，支援手機與桌面裝置。</p>
    <h3>支援哪些檔案預覽？</h3>
    <p>影片、音樂、圖片、PDF、Office 文件格式與文字／程式碼皆可線上預覽，純文字類可直接編輯。</p>
    <h3>分享出去的連結安全嗎？</h3>
    <p>分享連結可加密碼、設效期，撤銷後即時失效。</p>
